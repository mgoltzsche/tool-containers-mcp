services:
  statelesschatui:
    image: ghcr.io/mgoltzsche/statelesschatui:0.1.2
    ports:
      - "8000:8000"
    environment:
      OPENAI_BASE_URL: http://mcp-bridge:9000/v1
      OPENAI_MODELS_BASE_URL: http://localai:8080/v1
  mcp-bridge:
    image: ghcr.io/secretiveshell/mcp-bridge/mcp-bridge:0.5.1
    ports:
      - "9000:9000"
    volumes:
      - ./mcp-bridge-config.json:/mcp_bridge/config.json
    depends_on:
      - localai
      - tool-containers-mcp
  tool-containers-mcp:
    image: ghcr.io/mgoltzsche/tool-containers-mcp:0.5.0 # dev
    command:
      - --address=:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  localai:
    image: localai/localai:v4.1.2-gpu-vulkan
    ports:
      - "8080:8080"
    volumes:
      - 'localai-models:/models:z'
      - 'localai-backends:/backends:z'
    privileged: true

volumes:
  localai-models:
  localai-backends:
